name: Build AuthAlwaysOnTop

on:
  # Every branch, not just main: work lands on a topic branch first and the
  # point of this workflow is to find out whether it builds before it is
  # merged anywhere.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned on purpose: the project targets PlatformToolset v143 (VS 2022).
    # windows-latest moved to Server 2025 with VS 2026 in June 2026, and
    # windows-2022 stays supported as one of the two LTS images.
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        # Solution platform names, not project ones: the solution calls 32-bit
        # "x86" and maps it onto the project's "Win32" internally.
        platform: [x64, x86]

    steps:
      # Actions are pinned to commit SHAs; a moving tag would let an upstream
      # compromise reach this workflow unreviewed.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: Build Release ${{ matrix.platform }}
        run: msbuild AuthAlwaysOnTop.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /fl "/flp:logfile=msbuild-${{ matrix.platform }}.log;verbosity=normal"

      # Job logs need admin rights on the repository to read through the API,
      # so a failure otherwise surfaces as nothing but "exit code 1". Echoing
      # the compiler's own lines as workflow errors puts them in the check
      # annotations, which anyone can read.
      - name: Surface build errors
        if: failure()
        shell: pwsh
        run: |
          $log = "msbuild-${{ matrix.platform }}.log"
          if (-not (Test-Path $log)) { Write-Output "::error::msbuild produced no log file"; exit 0 }
          $hits = Get-Content $log |
                  Select-String -Pattern '\berror\b|: fatal |LNK\d{4}|MSB\d{4}' |
                  Select-Object -First 40
          if ($hits) { $hits | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) } }
          else { Write-Output "::error::no error lines matched; see the uploaded log artifact" }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msbuild-log-${{ matrix.platform }}
          path: msbuild-${{ matrix.platform }}.log
          if-no-files-found: warn
          retention-days: 7

      - name: List built executables
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter *.exe | Select-Object FullName,Length

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AuthAlwaysOnTop-${{ matrix.platform }}
          path: '**/AuthAlwaysOnTop.exe'
          if-no-files-found: error
          retention-days: 30
